<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Grid explainer architecture</title>
  <desc id="d">A question goes to the agent loop, which calls five tools on an MCP server. The server queries cached AEMO data in DuckDB. The eval harness runs the agent over 25 AER events and a Haiku judge scores each answer.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="760" height="400" rx="12" fill="#f8fafc"/>
  <g fill="#fff" stroke="#475569" stroke-width="1.5">
    <rect x="30" y="60" width="150" height="64" rx="8"/>
    <rect x="230" y="60" width="170" height="64" rx="8"/>
    <rect x="450" y="40" width="280" height="104" rx="8"/>
    <rect x="450" y="190" width="280" height="64" rx="8"/>
    <rect x="450" y="300" width="280" height="64" rx="8"/>
    <rect x="230" y="190" width="170" height="64" rx="8"/>
    <rect x="230" y="300" width="170" height="64" rx="8"/>
  </g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="105" y="88" font-weight="600">Question</text><text x="105" y="108" font-size="12" fill="#475569">"why did SA spike?"</text>
    <text x="315" y="88" font-weight="600">Agent loop</text><text x="315" y="108" font-size="12" fill="#475569">Claude tool use, ≤10 steps</text>
    <text x="590" y="66" font-weight="600">MCP server (5 tools)</text>
    <text x="590" y="90" font-size="12" fill="#475569">get_prices · get_demand</text>
    <text x="590" y="108" font-size="12" fill="#475569">get_generation_mix · get_interconnector_flows</text>
    <text x="590" y="126" font-size="12" fill="#475569">get_binding_constraints</text>
    <text x="590" y="218" font-weight="600">DuckDB over cached parquet</text><text x="590" y="238" font-size="12" fill="#475569">AEMO MMSDM monthly archives</text>
    <text x="590" y="328" font-weight="600">Ingest</text><text x="590" y="348" font-size="12" fill="#475569">nemosis download, fuel registry</text>
    <text x="315" y="218" font-weight="600">Answer</text><text x="315" y="238" font-size="12" fill="#475569">figures from tool results</text>
    <text x="315" y="328" font-weight="600">Eval harness</text><text x="315" y="348" font-size="12" fill="#475569">25 AER events, Haiku judge</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M180 92H228"/>
    <path d="M400 92H448"/>
    <path d="M590 144V188"/>
    <path d="M590 300V256"/>
    <path d="M315 124V188"/>
    <path d="M315 300V256" stroke-dasharray="5 4"/>
  </g>
  <text x="325" y="282" font-size="12" fill="#475569">scores</text>
</svg>
